<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QH Official - New App</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0f172a;color:white}
header{background:#1e293b;padding:15px;text-align:center;position:sticky;top:0}
header h1{font-size:24px;color:#facc15}
header p{font-size:13px;opacity:.7}
.hero{padding:30px 20px;text-align:center;background:linear-gradient(135deg,#2563eb,#7c3aed)}
.hero h2{font-size:28px;margin-bottom:10px}
.hero p{opacity:.9;margin-bottom:20px}
.btn{display:inline-block;background:#facc15;color:black;padding:12px 25px;border-radius:50px;font-weight:bold;text-decoration:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:20px}
.card{background:#1e293b;border-radius:15px;padding:20px;text-align:center}
.card h3{font-size:35px;margin-bottom:8px}
.card p{font-size:14px;opacity:.8}
.card b{color:#4ade80}
.section{padding:0 20px 20px}
.box{background:white;color:black;border-radius:15px;padding:20px}
.box h3{margin-bottom:10px}
.box input,.box select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px}
.box button{width:100%;padding:13px;background:#2563eb;color:white;border:none;border-radius:10px;font-weight:bold;font-size:16px}
footer{text-align:center;padding:20px;opacity:.6;font-size:13px}
</style>
</head>
<body>
<header><h1>QH OFFICIAL</h1><p>Hasnat Rahat • Sylhet, Bangladesh</p></header>
<div class="hero">
<h2>Welcome to QH Official 🔥</h2>
<p>নতুন অ্যাপ, নতুন শুরু। সবকিছু এক জায়গায়।</p>
<a class="btn" href="#order">এখন অর্ডার করো</a>
</div>
<div class="grid">
<div class="card"><h3>🛍️</h3><p>প্রোডাক্ট</p><b>100+ Item</b></div>
<div class="card"><h3>🚀</h3><p>ডেলিভারি</p><b>সারা বাংলাদেশ</b></div>
<div class="card"><h3>⭐</h3><p>রেটিং</p><b>4.9 / 5.0</b></div>
<div class="card"><h3>💬</h3><p>সাপোর্ট</p><b>24/7 Active</b></div>
</div>
<div class="section" id="order">
<div class="box">
<h3>অর্ডার ফর্ম 📝</h3>
<input type="text" id="name" placeholder="তোমার নাম লেখো">
<input type="text" id="phone" placeholder="মোবাইল নাম্বার">
<select id="product">
<option>QH T-Shirt - 450 টাকা</option>
<option>QH Hoodie - 950 টাকা</option>
<option>QH Cap - 350 টাকা</option>
<option>QH Watch - 1250 টাকা</option>
</select>
<button onclick="order()">অর্ডার কনফার্ম করো ✅</button>
<p id="msg" style="text-align:center;margin-top:10px;color:green;font-weight:bold"></p>
</div>
</div>
<footer>© 2026 QH Official - Made by Rahat</footer>
<script>
function order(){
let n=document.getElementById('name').value;
let p=document.getElementById('product').value;
if(n==""){alert("ভাই, নামটা দাও!");return;}
document.getElementById('msg').innerText="ধন্যবাদ "+n+"! তোমার "+p+" অর্ডার হইছে! 🎉";
}
</script>
</body>
</html>
